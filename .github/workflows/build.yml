name: "Build & Draft Release"

"on":
  push:
    tags:
      - 'v*'

env:
  INTG_NAME: cctv
  PYTHON_VER: 3.11.12-0.3.0

jobs:
  build:
    name: Build Release
    runs-on: ubuntu-24.04-arm
    outputs:
      version: ${{ steps.get-version-and-id.outputs.VERSION }}
      driver_id: ${{ steps.get-version-and-id.outputs.DRIVER_ID }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 200

      - name: Get version and id
        id: get-version-and-id
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "DRIVER_ID=$(jq .driver_id -r driver.json)" >> $GITHUB_ENV
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "DRIVER_ID=$(jq .driver_id -r driver.json)" >> $GITHUB_OUTPUT

      - name: Build
        run: |
          docker run --rm --name builder \
            --platform=linux/arm64 \
            --user=$(id -u):$(id -g) \
            -v ${GITHUB_WORKSPACE}:/workspace \
            docker.io/unfoldedcircle/r2-pyinstaller:${PYTHON_VER} \
            bash -euo pipefail -c '
              FF_VER=7.1.1
              FF_PREFIX=/workspace/ffbuild

              # Build a minimal, decode-only FFmpeg (H.264 + H.265 over RTSP).
              # PyAV is compiled against this instead of its prebuilt wheel, which
              # bundles every codec/encoder and inflates the release past the size
              # the integration manager can install in-place.
              cd /tmp
              curl -fsSL "https://ffmpeg.org/releases/ffmpeg-${FF_VER}.tar.xz" -o ffmpeg.tar.xz
              tar xf ffmpeg.tar.xz
              cd "ffmpeg-${FF_VER}"
              ./configure \
                --prefix="$FF_PREFIX" \
                --enable-shared --disable-static \
                --disable-programs --disable-doc --disable-htmlpages --disable-manpages --disable-podpages --disable-txtpages \
                --disable-everything \
                --enable-decoder=hevc,h264 \
                --enable-parser=hevc,h264 \
                --enable-demuxer=rtsp,sdp,rtp,mpegts,h264,hevc \
                --enable-protocol=file,tcp,udp,rtp \
                --enable-bsf=extract_extradata,h264_mp4toannexb,hevc_mp4toannexb \
                --enable-network \
                --enable-swscale --enable-swresample \
                --enable-small --disable-debug
              make -j"$(nproc)"
              make install

              export PKG_CONFIG_PATH="$FF_PREFIX/lib/pkgconfig"
              export LD_LIBRARY_PATH="$FF_PREFIX/lib:${LD_LIBRARY_PATH:-}"

              cd /workspace
              python -m pip install --no-binary=av -r requirements.txt

              pyinstaller --clean --onedir --name driver --strip \
                --add-data driver.json:. \
                --collect-all zeroconf \
                --collect-all ucapi \
                --collect-all ucapi_framework \
                --collect-all av \
                --hidden-import uc_intg_cctv.driver \
                --hidden-import uc_intg_cctv.device \
                --hidden-import uc_intg_cctv.config \
                --hidden-import uc_intg_cctv.client \
                --hidden-import uc_intg_cctv.setup_flow \
                --hidden-import uc_intg_cctv.const \
                --hidden-import uc_intg_cctv.media_player \
                --hidden-import uc_intg_cctv.select \
                --paths . \
                uc_intg_cctv/__init__.py
            '

      - name: Prepare artifacts
        run: |
          mkdir -p artifacts/bin
          mv dist/driver/* artifacts/bin/
          cp driver.json artifacts/
          echo "ARTIFACT_NAME=uc-intg-${{ env.DRIVER_ID }}-${{ env.VERSION }}-aarch64" >> $GITHUB_ENV

      - run: tar czvf ${{ env.ARTIFACT_NAME }}.tar.gz -C ${GITHUB_WORKSPACE}/artifacts .

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ env.ARTIFACT_NAME }}.tar.gz
          if-no-files-found: error
          retention-days: 3

  docker:
    name: Build and Push Docker Image
    runs-on: ubuntu-24.04
    needs: [build]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/uc-intg-cctv
          tags: |
            type=ref,event=tag
            type=raw,value=latest
      - uses: docker/build-push-action@v7
        env:
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  release:
    name: Create Release
    runs-on: ubuntu-24.04
    needs: [build, docker]
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: uc-intg-*
      - run: for D in *; do if [ -d "${D}" ]; then mv $D/* ./; fi; done
      - run: |
          for f in *.tar.gz; do
            echo "sha256 $(sha256sum $f)" >> ${{needs.build.outputs.driver_id}}.hash
          done
      - uses: ncipollo/release-action@v1
        with:
          artifacts: "*.tar.gz,${{needs.build.outputs.driver_id}}.hash"
          draft: true
          generateReleaseNotes: true
          artifactErrorsFailBuild: true
          tag: v${{needs.build.outputs.version}}
